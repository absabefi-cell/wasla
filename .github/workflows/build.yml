name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer
        run: |
          cp app/build/outputs/apk/principal/debug/app-principal-debug.apk Wasla.apk
          cp app/build/outputs/apk/deux/debug/app-deux-debug.apk Wasla2.apk

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wasla (derniere version)
          files: |
            Wasla.apk
            Wasla2.apk
          make_latest: true
